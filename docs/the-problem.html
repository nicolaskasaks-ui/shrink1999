<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    padding: 60px;
    background: #faf9f6;
    font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 520px;
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.08);
    border: 1px solid rgba(0,0,0,0.06);
  }
  .header {
    background: #db4a3a;
    color: #fff;
    padding: 14px 22px;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.1px;
  }
  .body {
    padding: 22px 22px 18px;
    color: #1a1a1a;
    font-size: 17px;
    line-height: 1.55;
  }
  .body p { margin: 0 0 18px; }
  button {
    appearance: none;
    background: #fff;
    border: 1px solid rgba(0,0,0,0.18);
    border-radius: 9px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 15px;
    color: #1a1a1a;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="header">API Error</div>
    <div class="body">
      <p>An image in the conversation exceeds the dimension limit for many-image requests (2000px). Start a new session with fewer images.</p>
      <button>Try again</button>
    </div>
  </div>
</body>
</html>
